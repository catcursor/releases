name: Publish binary artifacts

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      version:
        required: true
        type: string
      artifact_pattern:
        default: release-*
        type: string
    secrets:
      RELEASES_TOKEN:
        required: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: binary-release-${{ inputs.project }}-${{ inputs.version }}
      cancel-in-progress: false
    env:
      PROJECT: ${{ inputs.project }}
      VERSION: ${{ inputs.version }}
      TARGET_REPOSITORY: catcursor/releases
    steps:
      - name: Check destination and credentials
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          HAS_CROSS_REPO_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          if [[ "$CALLER_REPOSITORY" != "$TARGET_REPOSITORY" && "$HAS_CROSS_REPO_TOKEN" != true ]]; then
            echo '::error::Set RELEASES_TOKEN in the calling repository with Contents: write on catcursor/releases.'
            exit 1
          fi

      - name: Download only release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: release-assets
          merge-multiple: true

      - name: Verify archives and assemble checksums
        shell: python
        run: |
          import hashlib, os, pathlib, re
          root = pathlib.Path("release-assets")
          project = os.environ["PROJECT"]
          version = os.environ["VERSION"][1:]
          pattern = re.compile(re.escape(project + "-" + version + "-") + r"[a-z0-9._-]+\.(?:zip|tar\.gz)$")
          entries = list(root.iterdir())
          assert entries and all(p.is_file() and not p.is_symlink() for p in entries), "Only flat files are allowed"
          packages = sorted((p for p in entries if pattern.fullmatch(p.name)), key=lambda p: p.name)
          assert 1 <= len(packages) <= 20, "Missing or excessive packages"
          allowed = {p.name for p in packages} | {p.name + ".sha256" for p in packages}
          assert {p.name for p in entries} == allowed, "Unexpected artifacts; refusing to publish"
          lines = []
          for path in packages:
              expected_line = (root / (path.name + ".sha256")).read_text(encoding="ascii").strip()
              match = re.fullmatch(r"([0-9a-f]{64})  (.+)", expected_line)
              assert match and match[2] == path.name, "Invalid checksum sidecar"
              assert hashlib.sha256(path.read_bytes()).hexdigest() == match[1], "Checksum mismatch"
              lines.append(expected_line)
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          assets = [*packages, root / "SHA256SUMS"]
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-assets.txt").write_text(
              "\n".join(str(p.resolve()) for p in assets) + "\n", encoding="utf-8")
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-names.txt").write_text(
              "\n".join(sorted(p.name for p in assets)) + "\n", encoding="utf-8")

      - name: Publish verified binaries to the public repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${PROJECT}-${VERSION}"
          if gh release view "$tag" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Published versions are never overwritten."
            exit 1
          fi
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          printf '%s\n\n%s\n' "$PROJECT $VERSION" 'Binary packages and SHA-256 checksums. Source remains in its original repository.' > "$RUNNER_TEMP/release-notes.md"
          options=()
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$tag" "${assets[@]}" \
            --repo "$TARGET_REPOSITORY" --target main \
            --title "$PROJECT $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft --latest=false "${options[@]}"
          gh release view "$tag" --repo "$TARGET_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$RUNNER_TEMP/remote-assets.txt"
          diff -u "$RUNNER_TEMP/release-names.txt" "$RUNNER_TEMP/remote-assets.txt"
          gh release edit "$tag" --repo "$TARGET_REPOSITORY" --draft=false --latest=false
          printf '### Published %s %s\n\nhttps://github.com/%s/releases/tag/%s\n' "$PROJECT" "$VERSION" "$TARGET_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
